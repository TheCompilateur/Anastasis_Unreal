; TIME_WARP_001 : vitesse du temps en PIE. Liaisons de debug du moteur : absentes d'un build
; Shipping, coupees par -NoDebugExecBindings.
; Demande d'Alexandre (2026-10-01) : 8 accelere, 9 ralentit -- rangee des chiffres (sur AZERTY, la
; touche de position « 8 », sans Maj) et pave numerique. Aucune entree du jeu (IMC_*) n'utilise 8 ni 9.
[/Script/Engine.PlayerInput]
+DebugExecBindings=(Key=Eight,Command="Anastasis.Sim.Faster")
+DebugExecBindings=(Key=Nine,Command="Anastasis.Sim.Slower")
+DebugExecBindings=(Key=NumPadEight,Command="Anastasis.Sim.Faster")
+DebugExecBindings=(Key=NumPadNine,Command="Anastasis.Sim.Slower")
+DebugExecBindings=(Key=Add,Command="Anastasis.Sim.Faster")
+DebugExecBindings=(Key=Subtract,Command="Anastasis.Sim.Slower")
+DebugExecBindings=(Key=Pause,Command="Anastasis.Sim.Pause")
; player-goals-001 : la main du joueur, comme la reference (touches 1 a 5 = un but de la table du
; joueur, dans l'ordre affiche par la ligne BUTS ; 0 = retirer l'intention). Sans joueur incarne,
; la commande le dit et ne fait rien. Aucune entree du jeu (IMC_*) n'utilise 0 a 5.
+DebugExecBindings=(Key=One,Command="Anastasis.Player.Choose 1")
+DebugExecBindings=(Key=Two,Command="Anastasis.Player.Choose 2")
+DebugExecBindings=(Key=Three,Command="Anastasis.Player.Choose 3")
+DebugExecBindings=(Key=Four,Command="Anastasis.Player.Choose 4")
+DebugExecBindings=(Key=Five,Command="Anastasis.Player.Choose 5")
+DebugExecBindings=(Key=Zero,Command="Anastasis.Player.Goal none")

